name: Build Windows EXE

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pillow

    - name: Convert PNG Icon to ICO
      run: |
        python -c "from PIL import Image; img = Image.open('Accounting.png'); img.save('app_icon.ico', format='ICO', sizes=[(256, 256)])"

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --icon=app_icon.ico --add-data "Accounting.png;." app.py

    - name: Upload Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: Studio_Accounting_v3_Windows
        path: dist/app.exe
